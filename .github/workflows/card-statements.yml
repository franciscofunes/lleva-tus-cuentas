      - 'src/components/NotificationsDropdown*'
      - 'firestore.rules.bankSpendingBudgets'
      - 'src/utils/bankingModel*'
      - 'src/utils/bankingRules*'
      - 'src/utils/banksLitaContext*'
      - 'src/components/BankStatementSelector*'
      - 'src/components/PendingStatementLinkCard*'
      - 'firestore.rules.banks'
      - 'src/shared/animations/**'
      - '.github/workflows/card-statements.yml'
  push:
    branches:
      - main
      - feat/card-statement-pdf-review
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Validate opt-in QA runner syntax (without credentials)
        run: |
          node --check playwright.config.cjs
          node --check scripts/qa/prepare-auth.cjs
          node --check scripts/qa/target-policy.cjs
          node --check scripts/qa/financial-surfaces.cjs
          node --check e2e/transactions.authenticated.spec.cjs
          node --check e2e/financial-surfaces.authenticated.spec.cjs
          node --test scripts/qa/target-policy.test.cjs scripts/qa/financial-surfaces.test.cjs
      - name: Test statement imports, popovers, and consistent financial page transitions
        run: CI=true npm test -- --watch=false --runInBand src/components/BrandAssets.test.js src/utils/banksLitaContext.test.js src/utils/cardSpendingInsights.test.js src/utils/cardBudgetProgress.test.js src/components/CardSpendingControls.test.js src/pages/Home.test.js src/utils/cardConsumptionMarkdown.test.js src/components/CardConsumptionMarkdownImporter.test.js src/services/cardConsumptionImport.test.js src/services/bankBudgetService.test.js src/utils/bankSpendingRules.test.js src/utils/banksMarkdown.test.js src/components/BankOnboardingForm.test.js src/pages/Banks.test.js src/components/DeleteBankChargeDialog.test.js src/components/StatementLinkEditor.test.js src/components/PendingStatementLinkCard.test.js src/utils/bankingRules.test.js src/services/bankingService.test.js src/utils/bankingModel.test.js src/components/BankStatementSelector.test.js src/services/cardStatementService.test.js src/services/litaAdviceService.test.js src/components/CardStatementDetails.test.js src/components/LinkedStatementCard.test.js src/utils/cardStatementSearch.test.js src/components/NavbarPopovers.test.js src/components/PageDataSkeleton.test.js src/shared/animations/pageEntranceMotion.test.js src/components/AnimatedRoutes.test.js src/shared/constants/transactionsPageCopy.test.js src/components/FinancialPageLayout.test.js src/components/ChartViewer.test.js src/components/FinancialChartsSafety.test.js src/components/Card.test.js src/components/TransactionsQaJourney.test.js src/components/TransactionsHeaderActions.test.js src/components/FinancialHeaderActions.test.js src/pages/Dashboard.ux.test.js src/pages/PortfolioDetail.test.js src/utils/transactionsPageView.test.js src/actionCreators/databaseActions.delete.test.js src/components/DeleteTransactionDialog.test.js src/components/GenericModal.test.js src/utils/transactionsMarkdown.test.js src/components/LitaIframeClipboard.test.js src/components/FinancialOverviewPanel.test.js src/components/ExpenseFilter.test.js src/components/SearchBar.test.js src/utils/transactionSort.test.js src/utils/transactionSearch.test.js src/utils/transactionsExport.test.js src/utils/transactionsPdf.test.js src/utils/portfolioPdf.test.js src/utils/shareExportFile.test.js src/components/TransactionsExportReady.test.js src/components/PortfolioExportReady.test.js src/utils/transactionsPagination.test.js src/utils/portfolioExport.test.js src/utils/customCategories.test.js src/services/customCategoriesService.test.js src/utils/transactionDueDates.test.js src/actionCreators/databaseActions.customDetails.test.js src/utils/categoryExtraFields.test.js src/components/CategoryManager.test.js src/components/TransactionForm.test.js src/utils/transactionLocation.test.js src/services/litaPlacesService.test.js src/components/TransactionLocationField.test.js src/utils/spendingInsights.test.js src/utils/geoSpendingMap.test.js src/utils/geoSpendingMap.h3.test.js src/utils/geoTransactionInsights.test.js src/components/SpendingMapChart.test.js src/components/SpendingInsightsChart.test.js src/actionCreators/databaseActions.location.test.js src/components/CollapsibleHeading.test.js src/utils/litaChatMessages.test.js src/utils/categoryContains.test.js
      - name: Restore optional browser dependencies for production build
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile LTC
        run: npm run build
