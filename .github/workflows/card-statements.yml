name: Card statement import checks
on:
  pull_request:
    paths:
      - 'src/services/cardStatementService*'
      - 'src/components/CardStatement*'
      - 'src/components/TransactionForm.js'
      - 'src/components/TransactionLocationField*'
      - 'src/components/SpendingMapChart*'
      - 'src/components/SpendingInsightsChart*'
      - 'src/utils/transactionLocation*'
      - 'src/actionCreators/databaseActions.location.test.js'
      - 'src/utils/spendingInsights*'
      - 'src/components/ChartToogleMenu.js'
      - 'firestore.rules.transactionLocation'
      - 'src/components/AnimatedRoutes*'
      - 'src/components/FinancialPageLayout*'
      - 'src/components/AppFooter*'
      - 'src/components/*ChartWrapper*'
      - 'src/components/*LineChart*'
      - 'src/components/ChartViewer*'
      - 'src/components/FinancialChartsSafety.test.js'
      - 'src/components/RouteErrorBoundary*'
      - 'src/components/Card.js'
      - 'src/components/Card.test.js'
      - 'src/index.css'
      - 'public/index.html'
      - 'public/favicon*'
      - 'public/icon-*.png'
      - 'public/apple-touch-icon.png'
      - 'public/manifest.json'
      - 'src/components/BrandAssets.test.js'
      - 'src/components/LitaAssitantPanel*'
      - 'src/services/litaChatService.js'
      - 'src/services/litaAdviceService*'
      - 'src/components/LitaAssistant.js'
      - 'src/utils/litaChatMessages*'
      - 'src/components/LitaIframeClipboard.test.js'
      - 'src/components/FinancialOverviewPanel.test.js'
      - 'src/components/ExpenseFilter*'
      - 'src/components/SearchBar*'
      - 'src/utils/transactionSort*'
      - 'src/utils/transactionSearch*'
      - 'src/utils/transactionsExport.test.js'
      - 'src/components/TransactionsExportReady*'
      - 'src/components/ExportReadyModal*'
      - 'src/components/PortfolioExportReady*'
      - 'src/utils/exportCsvRows*'
      - 'src/utils/portfolioPdf*'
      - 'src/utils/portfolioExport.test.js'
      - 'src/components/TransactionsMarkdownImport.js'
      - 'src/utils/transactionsMarkdown*'
      - 'src/index.js'
      - 'src/actionCreators/databaseActions.js'
      - 'src/components/AvatarDropdown.js'
      - 'src/components/NotificationsDropdown.js'
      - 'src/components/FloatingMenu.js'
      - 'src/components/NavbarPopovers.test.js'
      - 'src/components/PageDataSkeleton*'
      - 'src/components/CategoryManager*'
      - 'src/utils/customCategories*'
      - 'src/utils/categoryExtraFields*'
      - 'src/utils/categoryContains*'
      - 'src/services/customCategoriesService.js'
      - 'src/services/customCategoriesService.test.js'
      - 'src/utils/transactionDueDates*'
      - 'src/shared/constants/category.const.js'
      - 'firestore.rules.customCategories'
      - 'firestore.rules.customTransactionDetails'
      - 'src/components/FinancialOverviewPanel*'
      - 'src/components/CollapsibleHeading*'
      - 'src/components/CollapsibleSection.js'
      - 'src/pages/PortfolioDetail.js'
      - 'src/utils/portfolioExport*'
      - 'src/utils/transactionsExport*'
      - 'src/utils/transactionsPdf*'
      - 'src/utils/shareExportFile*'
      - 'src/utils/transactionsPagination*'
      - 'src/pages/Dashboard.js'
      - 'src/pages/Portfolio.js'
      - 'src/pages/Banks*'
      - 'src/components/QuickAccessCard*'
      - 'src/components/BankOnboardingForm*'
      - 'src/utils/banksMarkdown*'
      - 'src/services/bankingService*'
      - 'src/utils/bankingModel*'
      - 'src/utils/bankingRules*'
      - 'src/utils/banksLitaContext*'
      - 'src/components/BankStatementSelector*'
      - 'firestore.rules.banks'
      - 'src/shared/animations/**'
      - '.github/workflows/card-statements.yml'
  push:
    branches:
      - main
      - feat/card-statement-pdf-review
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Test statement imports, popovers, and consistent financial page transitions
        run: CI=true npm test -- --watch=false --runInBand src/components/BrandAssets.test.js src/utils/banksLitaContext.test.js src/utils/banksMarkdown.test.js src/components/BankOnboardingForm.test.js src/pages/Banks.test.js src/utils/bankingRules.test.js src/services/bankingService.test.js src/utils/bankingModel.test.js src/components/BankStatementSelector.test.js src/services/cardStatementService.test.js src/services/litaAdviceService.test.js src/components/CardStatementDetails.test.js src/utils/cardStatementSearch.test.js src/components/NavbarPopovers.test.js src/components/PageDataSkeleton.test.js src/shared/animations/pageEntranceMotion.test.js src/components/AnimatedRoutes.test.js src/components/FinancialPageLayout.test.js src/components/ChartViewer.test.js src/components/FinancialChartsSafety.test.js src/components/Card.test.js src/utils/transactionsMarkdown.test.js src/components/LitaIframeClipboard.test.js src/components/FinancialOverviewPanel.test.js src/components/ExpenseFilter.test.js src/components/SearchBar.test.js src/utils/transactionSort.test.js src/utils/transactionSearch.test.js src/utils/transactionsExport.test.js src/utils/transactionsPdf.test.js src/utils/portfolioPdf.test.js src/utils/shareExportFile.test.js src/components/TransactionsExportReady.test.js src/components/PortfolioExportReady.test.js src/utils/transactionsPagination.test.js src/utils/portfolioExport.test.js src/utils/customCategories.test.js src/services/customCategoriesService.test.js src/utils/transactionDueDates.test.js src/actionCreators/databaseActions.customDetails.test.js src/utils/categoryExtraFields.test.js src/components/CategoryManager.test.js src/components/TransactionForm.test.js src/utils/transactionLocation.test.js src/utils/spendingInsights.test.js src/actionCreators/databaseActions.location.test.js src/components/CollapsibleHeading.test.js src/utils/litaChatMessages.test.js src/utils/categoryContains.test.js
      - name: Restore optional browser dependencies for production build
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile LTC
        run: npm run build
