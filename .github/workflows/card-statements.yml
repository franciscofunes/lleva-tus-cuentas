      - 'src/utils/cardBudgetProgress*'
      - 'src/pages/Home*'
      - 'README.md'
      - 'docs/**'
      - 'src/components/CardConsumptionMarkdownImporter*'
      - 'src/utils/cardConsumptionMarkdown*'
