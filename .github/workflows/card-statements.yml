name: Card statement import checks
on:
  pull_request:
    paths:
      - 'src/services/cardStatementService*'
      - 'src/components/CardStatement*'
      - 'src/components/TransactionForm.js'
      - 'src/components/AnimatedRoutes*'
      - 'src/components/LitaAssitantPanel*'
      - 'src/components/LitaIframeClipboard.test.js'
      - 'src/components/TransactionsMarkdownImport.js'
      - 'src/utils/transactionsMarkdown*'
      - 'src/index.js'
      - 'src/actionCreators/databaseActions.js'
      - 'src/components/AvatarDropdown.js'
      - 'src/components/NotificationsDropdown.js'
      - 'src/components/FloatingMenu.js'
      - 'src/components/NavbarPopovers.test.js'
      - 'src/components/PageDataSkeleton*'
      - 'src/pages/Dashboard.js'
      - 'src/pages/Portfolio.js'
      - 'src/shared/animations/**'
      - '.github/workflows/card-statements.yml'
  push:
    branches:
      - main
      - feat/card-statement-pdf-review
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Test statement imports, popovers, and consistent financial page transitions
        run: CI=true npm test -- --watch=false --runInBand src/services/cardStatementService.test.js src/components/CardStatementDetails.test.js src/utils/cardStatementSearch.test.js src/components/NavbarPopovers.test.js src/components/PageDataSkeleton.test.js src/shared/animations/pageEntranceMotion.test.js src/components/AnimatedRoutes.test.js src/utils/transactionsMarkdown.test.js src/components/LitaIframeClipboard.test.js
      - name: Restore optional browser dependencies for production build
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile LTC
        run: npm run build
